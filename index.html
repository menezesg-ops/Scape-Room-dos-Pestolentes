<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Templo dos Pestolentes</title>
<style>
:root{--abyss:#0f1613;--stone:#1d2a24;--moss:#3d5a4a;--ember:#ff9a3c;--bone:#ebe3cf;--mut:#9fb0a4;--ok:#7bd88f;--bad:#e0604f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 0,#22362d 0,var(--abyss) 70%);color:var(--bone);font:18px/1.6 Georgia,'Times New Roman',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:720px;margin:0 auto;padding:24px 18px 60px;min-height:100%}
.screen{animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;margin:.6em 0 .3em;font-weight:400;letter-spacing:.02em}
h2{font-size:1.6rem;font-weight:400;margin:.4em 0}
p{margin:.7em 0}.mut{color:var(--mut)}.otsep{border-left:3px solid var(--ember);padding-left:14px;font-style:italic}
button{font:inherit;color:var(--bone);background:var(--stone);border:1px solid var(--moss);border-radius:4px;padding:12px 16px;cursor:pointer;text-align:left;transition:background .2s,transform .1s}
button:hover:not(:disabled){background:#2a3d34}button:active:not(:disabled){transform:scale(.99)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.go{background:var(--ember);color:#1a0f05;border:0;font-weight:700;padding:13px 26px;margin-top:14px;text-align:center}
.go:hover:not(:disabled){background:#ffb166}
.opts{display:grid;gap:10px;margin-top:18px}
.opts .ok{background:#1f4a2c;border-color:var(--ok)}.opts .bad{background:#552620;border-color:var(--bad)}
.q{font-size:1.15rem;margin:1.1em 0 0}
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:.9rem;color:var(--mut);border-bottom:1px solid var(--moss);padding-bottom:12px}
.torches{display:flex;gap:6px}.t{width:14px;height:26px;position:relative}
.t::before{content:"";position:absolute;bottom:0;left:5px;width:4px;height:10px;background:#5a4632}
.t.on::after{content:"";position:absolute;bottom:9px;left:1px;width:12px;height:17px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 70%,#fff2b0,var(--ember) 55%,#d94b1c);animation:fl .35s infinite alternate}
@keyframes fl{to{transform:scale(.88,1.08) rotate(3deg)}}
.runes{display:flex;gap:5px;margin-left:auto}.r{width:11px;height:11px;border:1px solid var(--moss);transform:rotate(45deg)}.r.on{background:var(--ember);border-color:var(--ember);box-shadow:0 0 8px var(--ember)}
.shake{animation:sh .4s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;padding:6px 10px;font-size:.85rem;z-index:5}
.stats{display:flex;gap:24px;margin:1.2em 0}.stats b{display:block;font-size:2rem;color:var(--ember);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<button id="mute" aria-label="Ligar ou desligar o som">Som: ligado</button>
<div id="app"></div>
<script>
/* ===== DADOS ===== */
const NEED=[1,2,2,3,4], MAXERR=5; // acertos exigidos por câmara; erros tolerados por câmara
const CAM=[
{n:"O Corredor das Portas",cen:"Uma passagem estreita termina numa parede de pedra com portas entalhadas. Cada porta só se abre quando a inscrição ao lado é respondida.",dica:"Quando uma escolha vem depois da outra, as possibilidades não se somam: elas se multiplicam.",ven:"A porta desliza e uma corrente de ar frio leva a poeira embora."},
{n:"A Sala dos Glifos",cen:"Glifos luminosos cobrem o piso circular. Pisar na ordem errada faz a sala tremer.",dica:"Quando a ordem importa, trocar dois elementos de lugar cria uma possibilidade nova. O fatorial é seu aliado.",ven:"Os glifos formam uma seta e o piso se abre em uma escada descendente."},
{n:"O Cofre dos Totens",cen:"Totens de pedra guardam esferas de luz. Cada um exige o grupo certo de esferas ou símbolos que se repetem.",dica:"Nem toda escolha liga para a ordem. E, quando há elementos repetidos, algumas ordens são, na verdade, a mesma.",ven:"Os totens se abrem. Otsep sussurra: faz eras que ninguém chega tão longe."},
{n:"O Salão dos Guardiões",cen:"Estátuas armadas impõem as regras dos antigos. Quem desobedece é barrado pelas lanças.",dica:"Quando uma regra proíbe algo, muitas vezes é mais fácil contar tudo e depois subtrair o que é proibido.",ven:"Os guardiões baixam as armas. Falta apenas uma câmara."},
{n:"O Altar Final",cen:"Uma réplica invertida da sala do altar. Nas paredes, milhares de nomes antigos, e a última linha ainda brilha, recém-gravada: Pesto.",dica:"Aqui tudo se mistura. Decida primeiro se a ordem importa, depois conte.",ven:""}];
const Q=[ // [enunciado, alternativas, índice da correta]
[["Pesto vê 3 portas de entrada e, atrás de cada uma, 4 corredores diferentes que levam à câmara seguinte. Quantos caminhos distintos ele pode seguir, passando por uma porta e depois por um corredor?",["7","12","16","64"],1],
["O cofre da câmara tem uma senha de 3 algarismos (de 0 a 9), podendo repetir algarismos. Quantas senhas são possíveis?",["1000","720","900","30"],0],
["Quantos números pares de 2 algarismos existem?",["40","50","45","90"],2],
["Três estátuas diferentes devem ser colocadas em 3 pedestais, uma em cada pedestal. De quantas formas isso pode ser feito?",["3","9","27","6"],3],
["Uma moeda sagrada é lançada 4 vezes e registra-se a sequência de caras e coroas. Quantas sequências são possíveis?",["8","12","16","24"],2]],
[["Quantos anagramas tem a palavra PESTO?",["25","60","120","720"],2],
["Entre 8 glifos distintos, Pesto deve pisar em 3 deles, em ordem, sem repetir nenhum. Quantas sequências existem?",["24","56","512","336"],3],
["Sete espíritos disputam um pódio com 1º, 2º e 3º lugares. Quantos pódios diferentes são possíveis?",["35","210","343","840"],1],
["Quantas senhas de 3 letras distintas podem ser formadas com as letras A, B, C, D, E?",["10","60","120","125"],1],
["Quantos números ímpares de 3 algarismos distintos podem ser formados com os algarismos 1, 2, 3, 4 e 5?",["24","48","60","36"],3]],
[["Pesto deve escolher 3 de 8 exploradores para formar um grupo (a ordem de escolha não importa). Quantos grupos distintos existem?",["24","56","112","336"],1],
["Quantos anagramas tem a palavra ARARA?",["5","20","10","60"],2],
["Quantos anagramas da palavra PESTO têm as letras P e E juntas, em qualquer ordem?",["24","48","96","120"],1],
["O salão do templo tem formato de octógono (8 vértices). Quantas diagonais ele possui?",["16","28","20","40"],2],
["Dentre 4 mulheres e 3 homens, quantas comissões de 3 pessoas podem ser formadas com exatamente 2 mulheres e 1 homem?",["18","12","21","35"],0]],
[["Quantos anagramas da palavra TEMPLO têm as letras T e E juntas, em qualquer ordem?",["120","240","360","720"],1],
["De um grupo de 5 homens e 4 mulheres, deve-se formar uma comissão de 3 pessoas com pelo menos 1 mulher. Quantas comissões são possíveis?",["74","84","94","60"],0],
["Seis guardiões formam uma fila. Dois deles, os rivais Ur e Ka, não podem ficar lado a lado. Quantas filas são possíveis?",["240","360","480","720"],2],
["Quatro exploradores serão escolhidos entre 8. Ana e Beto, dois dos 8, não aceitam participar juntos do mesmo grupo. Quantos grupos são possíveis?",["55","56","45","70"],0],
["Para abrir a porta do salão, é preciso formar um grupo de 4 pessoas escolhidas entre 6 matemáticos e 4 engenheiros, com pelo menos 2 engenheiros. Quantos grupos são possíveis?",["90","115","125","195"],1]],
[["Quantos anagramas da palavra ARARAS têm as duas letras R juntas?",["10","30","60","20"],3],
["Pesto deve ativar 5 totens entre 10: 4 são de ouro e 6 são de pedra. Para o portão abrir, pelo menos 2 dos ativados devem ser de ouro. De quantas formas ele pode escolher os totens?",["126","192","186","246"],2],
["Seis exploradores formam uma fila. O guia Ur deve ficar em alguma posição antes do guia Ka (não necessariamente ao lado). Quantas filas são possíveis?",["360","240","480","720"],0],
["Quantos anagramas da palavra ESPELHO têm todas as vogais juntas?",["180","720","1260","360"],3],
["A senha do portão final é formada por 4 letras distintas escolhidas entre A, B, C, D, E e F, e deve conter as letras A e B. Quantas senhas são possíveis?",["120","180","144","360"],2]]];
const INTRO=["Pesto acorda numa sala subterrânea, despertado por uma luz forte. É Otsep, um espírito, que fala em uma língua que ele não entende.","Otsep explica: este é o templo dos Pestolentes. Quem entra é amaldiçoado e só sai vencendo cinco câmaras de Análise Combinatória, com 1, 2, 2, 3 e 4 acertos. Em cada câmara, Pesto pode errar até 5 vezes. No sexto erro, ficará preso para sempre.","A partir daqui, Otsep só poderá dar dicas. \"Boa sorte, Pesto.\""];
const FINAL=["O último aro acende e uma porta de luz branca se abre. A luz não aquece, e Pesto não faz sombra.","Otsep: \"Você não desmaiou quando o chão se abriu, Pesto. Você morreu naquele instante. O que acordou diante de mim foi o seu espírito. A regra do templo me impedia de contar.\"","Pesto entende tudo: o corte que sumiu, a chama que não queimou, o espelho vazio. A maldição prometia uma saída, não a volta à vida. Mas o vencedor ganha um direito: ler a Última Página.","Pesto lê em voz alta cada nome preso no templo. A cada nome, um espírito sobe como um fio de luz. O último nome é o de Otsep, que lido ao contrário é o de Pesto. \"Obrigado, explorador.\" Otsep sorri e se dissolve em luz.","Pesto atravessa o salão, vê o próprio corpo ao lado do livro e sai. Junto aos destroços do avião, o espírito do piloto acena: \"Demorou, chefe!\"","Pesto queria ser um explorador famoso. Ninguém saberá da sua descoberta, mas centenas de almas conhecem o seu nome. Era fama suficiente."];

/* ===== SOM ===== */
let AC,mute=false,drone;
const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC};
function tone(f,d,type="sine",v=.14,w=0){if(mute)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+w;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const sfx={click:()=>tone(330,.08,"triangle",.1),ok:()=>{tone(523,.18);tone(659,.18,"sine",.14,.12);tone(784,.35,"sine",.14,.24)},bad:()=>{tone(160,.45,"sawtooth",.1);tone(110,.6,"sawtooth",.1,.15)},door:()=>{tone(70,1.2,"triangle",.2);tone(98,1.2,"triangle",.12,.2)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.8,"sine",.12,i*.25)),lose:()=>[220,185,147,110].forEach((f,i)=>tone(f,.7,"triangle",.14,i*.3))};
function music(){if(drone)return;const c=ac(),g=c.createGain();g.gain.value=mute?0:.05;g.connect(c.destination);const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.15;lg.gain.value=.02;lfo.connect(lg);lg.connect(g.gain);lfo.start();[55,82.4,110.5].forEach(f=>{const o=c.createOscillator();o.type="triangle";o.frequency.value=f;o.connect(g);o.start()});drone=g}
document.getElementById("mute").onclick=e=>{mute=!mute;e.target.textContent="Som: "+(mute?"desligado":"ligado");if(drone)drone.gain.value=mute?0:.05;sfx.click()};

/* ===== JOGO ===== */
const app=document.getElementById("app");let S;
const show=h=>{app.innerHTML=`<div class="screen">${h}</div>`};
const btn=(sel,fn)=>{const b=app.querySelector(sel);b.onclick=()=>{sfx.click();fn()}};
function start(){show(`<h1>O Templo dos Pestolentes</h1><p class="mut">Um escape room de Análise Combinatória. Pesto caiu em um templo amaldiçoado e só a Matemática pode tirá-lo de lá.</p><button class="go" id="b">Abrir o livro</button>`);btn("#b",()=>{S={f:0,ok:0,err:0,done:0,tot:0,used:[[],[],[],[],[]]};music();story(0)})}
function story(i){show(`<h2>O despertar</h2><p>${INTRO[i]}</p><button class="go" id="b">${i<INTRO.length-1?"Continuar":"Entrar na primeira câmara"}</button>`);btn("#b",()=>i<INTRO.length-1?story(i+1):chamber())}
function chamber(){const c=CAM[S.f];S.ok=0;S.err=0;sfx.door();show(`<p class="mut">Câmara ${S.f+1} de 5 · ${NEED[S.f]} ${NEED[S.f]>1?"acertos":"acerto"} para avançar</p><h2>${c.n}</h2><p>${c.cen}</p><p class="otsep">${c.dica}</p><button class="go" id="b">Enfrentar o desafio</button>`);btn("#b",ask)}
function hud(){const left=MAXERR-S.err,gained=S.done+S.ok;return`<div class="hud"><span>Câmara ${S.f+1}/5</span><span>Acertos: ${S.ok}/${NEED[S.f]}</span><span class="torches" title="Erros restantes">${Array.from({length:MAXERR},(_,i)=>`<i class="t ${i<left?"on":""}"></i>`).join("")}</span><span class="runes" title="Progresso total">${Array.from({length:12},(_,i)=>`<i class="r ${i<gained?"on":""}"></i>`).join("")}</span></div>`}
function pick(){const p=Q[S.f],u=S.used[S.f];if(u.length>=p.length)u.length=0;let i;do{i=Math.random()*p.length|0}while(u.includes(i));u.push(i);return p[i]}
function ask(){const q=pick(),o=q[1].map((t,i)=>({t,c:i===q[2]})).sort(()=>Math.random()-.5);
show(`${hud()}<p class="q">${q[0]}</p><div class="opts">${o.map((x,i)=>`<button>${"ABCD"[i]}) ${x.t}</button>`).join("")}</div><p id="fb" class="otsep" style="visibility:hidden">.</p>`);
const bs=[...app.querySelectorAll(".opts button")];bs.forEach((b,i)=>b.onclick=()=>answer(b,bs,o,i))}
function answer(b,bs,o,i){bs.forEach(x=>x.disabled=true);const ok=o[i].c,fb=app.querySelector("#fb");bs[o.findIndex(x=>x.c)].classList.add("ok");
if(ok){S.ok++;sfx.ok();fb.textContent="Correto. As runas brilham.";}else{b.classList.add("bad");S.err++;S.tot++;sfx.bad();app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake");fb.textContent=S.err>MAXERR?"Sexta falha. As tochas se apagam...":"Errou. Uma tocha se apagou, e uma nova pergunta virá.";}
fb.style.visibility="visible";
setTimeout(()=>{if(S.ok>=NEED[S.f])cleared();else if(S.err>MAXERR)lose();else ask()},1700)}
function cleared(){S.done+=S.ok;if(S.f===4){sfx.win();return final(0)}sfx.door();const c=CAM[S.f];show(`${hud()}<h2>Câmara vencida</h2><p>${c.ven}</p><button class="go" id="b">Descer para a próxima câmara</button>`);btn("#b",()=>{S.f++;chamber()})}
function final(i){show(`<h2>O fim do desafio</h2><p>${FINAL[i]}</p><button class="go" id="b">${i<FINAL.length-1?"Continuar":"Ver resultado"}</button>`);btn("#b",()=>i<FINAL.length-1?final(i+1):win())}
function win(){show(`<h1>Almas libertadas</h1><p>A maldição dos Pestolentes foi quebrada.</p><div class="stats"><div><b>12</b>acertos</div><div><b>${S.tot}</b>erros cometidos</div></div><button class="go" id="b">Jogar novamente</button>`);btn("#b",start)}
function lose(){sfx.lose();show(`<h1>Preso para sempre</h1><p>As paredes se fecham e as tochas se apagam. Você chegou à câmara ${S.f+1}, ${CAM[S.f].n}.</p><p class="otsep">Sinto muito, Pesto. O templo ganhou desta vez. Mas ele sempre devolve o tempo a quem quer tentar de novo.</p><button class="go" id="b">Tentar de novo</button>`);btn("#b",start)}
start();
</script>
</body>
</html>
